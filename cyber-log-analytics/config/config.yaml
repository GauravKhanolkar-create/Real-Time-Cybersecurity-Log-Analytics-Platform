kafka:
  bootstrap_servers: "kafka:9092"
  log_topic: "security-logs"
  alert_topic: "security-alerts"
  producer_rate_per_sec: 20

spark:
  master: "spark://spark:7077"
  checkpoint_dir: "/opt/app/checkpoints"
  trigger_interval: "5 seconds"

elasticsearch:
  host: "http://elasticsearch:9200"
  index_logs: "security-logs"
  index_alerts: "security-alerts"

mysql:
  host: "mysql"
  port: 3306
  db: "cyberlog_db"
  user: "cyberlog"
  password: "cyberlog_pw"
  table_logs: "security_logs"
  table_alerts: "security_alerts"
  jdbc_driver: "com.mysql.cj.jdbc.Driver"

detection:
  failed_login_threshold: 5
  failed_login_window_seconds: 60
  port_scan_unique_ports_threshold: 15
  port_scan_window_seconds: 30
  large_transfer_bytes_threshold: 50000000
  blacklisted_ips:
    - "203.0.113.66"
    - "198.51.100.23"
    - "192.0.2.187"
  ml_anomaly_score_threshold: 0.5

model:
  path: "/opt/app/ml/models/isolation_forest.joblib"
  scaler_path: "/opt/app/ml/models/scaler.joblib"
  feature_columns:
    - "bytes_sent"
    - "bytes_received"
    - "duration_ms"
    - "dst_port"
    - "failed_login_count_5m"
    - "unique_ports_contacted_1m"

alerting:
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    smtp_user: ""
    smtp_password: ""
    to_addresses: []
  slack:
    enabled: false
    webhook_url: ""
